# 定期実行：毎時0分に起動し、スプレッドシートの「実行間隔（時間）」を満たしていれば処理する
name: Deal Radar（定期実行）

on:
  schedule:
    - cron: '0 * * * *'
  # 「Run workflow」ボタン＝今すぐ取得（手動取得の最短間隔を守るので、連打しても実行は抑えられる）
  workflow_dispatch:

# 前の実行が終わる前に次が始まらないようにする（重複通知の防止）
# 待機できるのは1件だけで、それ以上の起動は自動で取り消される（連打しても溜まらない）
concurrency:
  group: deal-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_SOURCE: ${{ vars.DATA_SOURCE || 'mock' }}
      STORAGE: sheets
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_ERROR_WEBHOOK_URL: ${{ secrets.SLACK_ERROR_WEBHOOK_URL }}
      PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
      PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
      PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
      APP_TIMEZONE: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none

      - name: Composer キャッシュ
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: 実行
        run: php bin/run.php ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}

      - name: ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: storage/logs/
          retention-days: 14
