services:
  # CLI（ジョブ実行・テスト・composer）
  app:
    build: ./docker
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false

  # 閲覧用ダッシュボード http://localhost:8094（既存の 8080 などと衝突しないポート）
  web:
    build: ./docker
    command: php -S 0.0.0.0:8080 -t public
    ports:
      - "${DASHBOARD_PORT:-8094}:8080"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
